<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimaCheck</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Helvetica Neue Thin';
            src: url('./img/HelveticaNeueThin.otf') format('opentype');
            font-weight: 100;
            font-style: normal;
        }

        body {
            font-family: 'Helvetica Neue Thin', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-image: url('./img/bgTesla2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass {
            background: rgba(159, 159, 159, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 40px 30px;
            width: 90%;
            max-width: 360px;
            color: white;
            text-align: center;
            box-shadow: 0 15px 50px 0 rgba(0, 0, 0, 0.5);
        }

        .search-container {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .search-bar {
            background: rgba(0, 0, 0, 0.3);
            border: none;
            border-radius: 25px;
            padding: 12px 15px 12px 45px;
            width: 100%;
            color: white;
            font-size: 18px;
            outline: none;
            font-family: inherit;
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
        }

        .search-button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 50px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .search-button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
        }

        .city-name {
            font-size: 70px;
            font-weight: 100;
            margin: 10px 0;
            line-height: 1;
        }

        .temperature {
            font-size: 110px;
            font-weight: 100;
            margin: -5px 0 0 0;
            line-height: 1;
            position: relative;
            display: inline-block;
        }

        .degree-symbol {
            font-size: 50px;
            position: absolute;
            top: 10px;
            right: -40px;
        }

        .description {
            font-size: 28px;
            font-weight: 100;
            margin: 0 0 40px 0;
            opacity: 0.9;
        }

        .forecast-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0;
        }

        .forecast-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .forecast-item i {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .forecast-temp {
            font-size: 20px;
            font-weight: 100;
        }

        /* Weather condition colors */
        .fa-sun {
            color: #ff9d00 !important;
        }

        .fa-cloud {
            color: #e0e0e0 !important;
        }

        .fa-cloud-sun {
            color: #ffcf40 !important;
        }
    </style>
</head>

<body>
    <div class="glass">
        <div class="search-container">
            <div class="input-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="city" placeholder="Cairo" class="search-bar">
            </div>
            <button onclick="getWeather()" class="search-button">Search</button>
        </div>

        <div id="weather-display">
            <h1 id="city-display" class="city-name">Cairo</h1>
            <div class="temperature-container">
                <p id="temp-display" class="temperature">28<span class="degree-symbol">°</span></p>
            </div>
            <p id="desc-display" class="description">cloudy</p>
        </div>

        <div id="hourly-forecast" class="forecast-container">
            <!-- Simulated Forecast Data to match image exactly on load -->
            <div class="forecast-item">
                <i class="fas fa-sun"></i>
                <span class="forecast-temp">32</span>
            </div>
            <div class="forecast-item">
                <i class="fas fa-sun"></i>
                <span class="forecast-temp">34</span>
            </div>
            <div class="forecast-item">
                <i class="fas fa-sun"></i>
                <span class="forecast-temp">31</span>
            </div>
            <div class="forecast-item">
                <i class="fas fa-cloud-sun"></i>
                <span class="forecast-temp">29</span>
            </div>
            <div class="forecast-item">
                <i class="fas fa-sun"></i>
                <span class="forecast-temp">34</span>
            </div>
            <div class="forecast-item">
                <i class="fas fa-cloud"></i>
                <span class="forecast-temp">26</span>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
